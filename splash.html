<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif}
.box{height:calc(100% - 2px);margin:1px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
background:radial-gradient(circle at 30% 20%,#4f46e5,#1e1b4b 70%);animation:pop .6s ease-out both;position:relative;overflow:hidden}
.box::before,.box::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(124,58,237,.35);filter:blur(50px);animation:float 6s ease-in-out infinite}
.box::before{top:-60px;left:-40px}.box::after{bottom:-70px;right:-40px;background:rgba(59,130,246,.35);animation-delay:-3s}
.logo-wrap{position:relative;width:96px;height:96px;display:grid;place-items:center;z-index:1}
.ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;animation:spin 1.1s linear infinite}
.logo{width:68px;height:68px;border-radius:18px;display:grid;place-items:center;font:700 26px Consolas,monospace;background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 8px 30px rgba(0,0,0,.4);animation:pulse 1.6s ease-in-out infinite}
h1{margin:22px 0 4px;font-size:30px;letter-spacing:1px;z-index:1;animation:up .8s .3s ease-out both}
p{margin:0;font-size:13px;opacity:.75;z-index:1;animation:up .8s .5s ease-out both}
.bar{width:220px;height:5px;border-radius:5px;background:rgba(255,255,255,.18);margin-top:30px;overflow:hidden;z-index:1}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#60a5fa,#c084fc);animation:load 2.6s .2s ease-in-out forwards}
.status{margin-top:10px;font-size:11px;opacity:.6;z-index:1;height:14px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes load{to{width:100%}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translate(30px,20px)}}
</style></head><body>
<div class="box">
  <div class="logo-wrap"><div class="ring"></div><div class="logo">&lt;/&gt;</div></div>
  <h1>DevNotes</h1>
  <p>Your code snippets, always at hand</p>
  <div class="bar"><i></i></div>
  <div class="status" id="st">Starting up...</div>
</div>
<script>
const msgs=['Starting up...','Loading your notes...','Preparing workspace...','Almost ready...'];
let i=0;setInterval(()=>{i=Math.min(i+1,msgs.length-1);document.getElementById('st').textContent=msgs[i];},700);
</script></body></html>
